name: 'Step 2: Publish Release'
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'The target branch'
        required: false
      release_url:
        description: 'The URL of the draft GitHub release'
        required: false
      steps_to_skip:
        description: 'Comma separated list of steps to skip'
        required: false

permissions:
  contents: read

jobs:
  publish_release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: jupyterlab/maintainer-tools/.github/actions/base-setup@b9d5c28489f8b460cef48868f303b97c20f8fe1b # v1.1.2

      - uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0 # zizmor: ignore[github-app]
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Populate Release
        id: populate-release
        uses: jupyter-server/jupyter_releaser/.github/actions/populate-release@ae340ad3f2f83e1a2f50b988050bf453b932e69a # v2
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: ${{ github.event.inputs.branch }}
          release_url: ${{ github.event.inputs.release_url }}
          steps_to_skip: ${{ github.event.inputs.steps_to_skip }}

      - name: Finalize Release
        id: finalize-release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        uses: jupyter-server/jupyter_releaser/.github/actions/finalize-release@ae340ad3f2f83e1a2f50b988050bf453b932e69a # v2
        with:
          token: ${{ steps.app-token.outputs.token }}
          release_url: ${{ steps.populate-release.outputs.release_url }}

      - name: '** Next Step **'
        if: ${{ success() }}
        env:
          FINAL_RELEASE_URL: ${{ steps.finalize-release.outputs.release_url }}
        run: |
          echo "Verify the final release"
          echo "${FINAL_RELEASE_URL}"

      - name: '** Failure Message **'
        if: ${{ failure() }}
        env:
          DRAFT_RELEASE_URL: ${{ steps.populate-release.outputs.release_url }}
        run: |
          echo "Failed to Publish the Draft Release Url:"
          echo "${DRAFT_RELEASE_URL}"

      - name: Authenticate to Google Cloud (OSS Exit Gate)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Clean up failed staging attempt for this exact version (if any)
        run: |
          python3 - <<'PY'
          import email, glob, re, subprocess, tarfile, zipfile
          seen = set()
          for f in sorted(glob.glob(".jupyter_releaser_checkout/dist/**/*.whl", recursive=True) + glob.glob(".jupyter_releaser_checkout/dist/**/*.tar.gz", recursive=True)):
            try:
              if f.endswith(".whl"):
                with zipfile.ZipFile(f) as zf:
                  meta = [n for n in zf.namelist() if n.endswith(".dist-info/METADATA")][0]
                  msg = email.message_from_bytes(zf.read(meta))
              else:
                with tarfile.open(f) as tf:
                  info = [m for m in tf.getmembers() if m.name.endswith("/PKG-INFO") or m.name == "PKG-INFO"][0]
                  msg = email.message_from_bytes(tf.extractfile(info).read())
              pkg = re.sub(r"[-_.]+", "-", msg["Name"].strip()).lower()
              ver = msg["Version"].strip()
            except Exception:
              continue
            if (pkg, ver) in seen:
              continue
            seen.add((pkg, ver))
            if subprocess.run([
                "gcloud", "artifacts", "versions", "describe", ver,
                f"--package={pkg}", "--project=oss-exit-gate-prod", "--location=us", "--repository=scheduler-jupyter-plugin--pypi"
            ], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode == 0:
              subprocess.run([
                  "gcloud", "artifacts", "versions", "delete", ver,
                  f"--package={pkg}", "--project=oss-exit-gate-prod", "--location=us", "--repository=scheduler-jupyter-plugin--pypi", "--quiet"
              ], check=False)
          PY
      - name: Stage distributions to OSS Exit Gate and upload manifest
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python -m pip install --upgrade twine
          TWINE_PASSWORD="$(gcloud auth print-access-token)"
          echo "::add-mask::${TWINE_PASSWORD}"
          python -m twine upload \
            --repository-url "https://us-python.pkg.dev/oss-exit-gate-prod/scheduler-jupyter-plugin--pypi/" \
            -u oauth2accesstoken \
            -p "${TWINE_PASSWORD}" \
            .jupyter_releaser_checkout/dist/*
          python3 - .jupyter_releaser_checkout/dist/* <<'PY'
          import email, json, re, sys, tarfile, zipfile
          pairs = set()
          for path in sys.argv[1:]:
            if path.endswith(".whl"):
              with zipfile.ZipFile(path) as zf:
                for name in zf.namelist():
                  if name.endswith(".dist-info/METADATA"):
                    msg = email.message_from_bytes(zf.read(name))
                    pkg = re.sub(r"[-_.]+", "-", msg["Name"].strip()).lower()
                    pairs.add((pkg, msg["Version"].strip()))
                    break
            elif path.endswith(".tar.gz"):
              with tarfile.open(path, "r:gz") as tf:
                for member in tf.getmembers():
                  if member.name.endswith("/PKG-INFO") and member.name.count("/") == 1:
                    f = tf.extractfile(member)
                    if f is not None:
                      msg = email.message_from_bytes(f.read())
                      pkg = re.sub(r"[-_.]+", "-", msg["Name"].strip()).lower()
                      pairs.add((pkg, msg["Version"].strip()))
                    break
          if not pairs:
            raise SystemExit("ERROR: No .whl/.tar.gz package metadata found for manifest.json")
          manifest = {
              "publish_all": False,
              "publishing_groups": [{
                  "packages": [{"name": pkg, "version": ver} for pkg, ver in sorted(pairs)]
              }],
          }
          with open("manifest.json", "w", encoding="utf-8") as fh:
            json.dump(manifest, fh, indent=2)
            fh.write("\n")
          PY
          gcloud storage cp manifest.json \
            "gs://oss-exit-gate-prod-projects-bucket/scheduler-jupyter-plugin/pypi/manifests/manifest-${RUN_ID}-${RUN_ATTEMPT}.json"
